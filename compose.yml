services:
  mariadb:
    build:
      context: docker/mariadb-dev
      dockerfile: Dockerfile
    container_name: divolte-ng-mariadb
    ports:
      - "3306:3306"
    environment:
      MARIADB_ROOT_PASSWORD: "devpass"
      MARIADB_DATABASE: "divolte_config"
      MARIADB_USER: "divolte"
      MARIADB_PASSWORD: "change-me"
    volumes:
      - mariadb_data:/var/lib/mysql

  kafka:
    image: docker.io/apache/kafka:3.7.0
    container_name: divolte-ng-kafka
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: "1"
      KAFKA_PROCESS_ROLES: "broker,controller"
      KAFKA_LISTENERS: "EXTERNAL://:9092,CONTROLLER://:9093,PLAINTEXT://:9094"
      KAFKA_ADVERTISED_LISTENERS: "EXTERNAL://localhost:9092,PLAINTEXT://kafka:9094"
      KAFKA_CONTROLLER_LISTENER_NAMES: "CONTROLLER"
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: "EXTERNAL:PLAINTEXT,PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT"
      KAFKA_CONTROLLER_QUORUM_VOTERS: "1@kafka:9093"
      KAFKA_INTER_BROKER_LISTENER_NAME: "PLAINTEXT"
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: "1"
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: "1"
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: "1"
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: "0"
      KAFKA_NUM_PARTITIONS: "1"
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
    volumes:
      - kafka_data:/tmp/kraft-combined-logs
    networks:
      default:
      druid_bus:
        aliases:
          - kafka

  divolte-collector:
    build:
      context: .
      dockerfile: docker/divolte-collector/Dockerfile
    container_name: divolte-ng-collector
    restart: on-failure
    ports:
      - "8290:8290"
      - "8291:8291"
    depends_on:
      - mariadb
      - kafka
    environment:
      DIVOLTE_KAFKA_BROKER_LIST: "kafka:9094"
      DIVOLTE_KAFKA_CLIENT_ID: "divolte-ng-podman"
      DIVOLTE_DB_PASSWORD: "change-me"
      DIVOLTE_ADMIN_PASSWORD: "change-me"
    command: ["-config", "configs/server.podman.yaml"]

volumes:
  mariadb_data:
  kafka_data:

networks:
  default:
  druid_bus:
    external: true
    name: druid-cluster_default
